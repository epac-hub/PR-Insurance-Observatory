name: Deploy to GitHub Pages

# Publishes the repository root to the gh-pages branch, which GitHub Pages
# serves (Settings, Pages, Source: "Deploy from a branch", branch gh-pages).

on:
  push:
    branches: [main, claude/great-ptolemy-slaw15]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          exclude_assets: '.github,README.md,.gitignore'
          force_orphan: true
          commit_message: 'Deploy site from ${{ github.sha }}'
